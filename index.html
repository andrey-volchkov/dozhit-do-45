<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Выдержка</title>
<meta name="description" content="Интерактивное кино. Жизнь в двенадцати днях, 1905–1945.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23111' stroke='%23c9bfae' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23c9bfae'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/old-standard-tt-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/pt-serif-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="era-silent">
<main id="stage" aria-live="polite">
  <div id="frame"></div>
  <div id="shade"></div>
  <div id="doc" hidden></div>
  <div id="dock">
    <div id="text"></div>
    <div id="choices" role="group"></div>
    <div id="fuse"><i></i></div>
  </div>
  <div id="title" hidden></div>
  <canvas id="grain" aria-hidden="true"></canvas>
  <div id="vignette" aria-hidden="true"></div>
  <div id="flash" aria-hidden="true"></div>
</main>

<section id="start">
  <h1>Выдержка</h1>
  <p class="sub">Жизнь в двенадцати днях. 1905–1945</p>
  <nav>
    <button id="btn-new">Начать</button>
    <button id="btn-continue" hidden>Продолжить</button>
    <button id="btn-archive" hidden>Архив жизней</button>
  </nav>
  <p class="hint">Лучше в наушниках и в темноте.</p>
  <ol id="archive" hidden></ol>
</section>

<button id="menu-btn" aria-label="Меню" hidden>≡</button>
<section id="menu" hidden>
  <button data-act="sound">Звук: вкл</button>
  <button data-act="motion">Движение: вкл</button>
  <button data-act="restart">Начать жизнь заново</button>
  <button data-act="close">Вернуться</button>
</section>

<script src="vendor/ink.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
